name: Python Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  mypy-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          backend/requirements/default.txt
          backend/requirements/dev.txt
    - run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements/default.txt
        pip install -r backend/requirements/dev.txt

    - name: Run MyPy
      run: |
        cd backend
        mypy .

    - name: Run ruff
      run: |
        cd backend
        ruff .

    - name: Check import order with reorder-python-imports
      run: |
        cd backend
        find ./danswer ./heal -name "*.py" | xargs reorder-python-imports --py311-plus

    - name: Check code formatting with Black
      run: |
        cd backend
        black --check .

    - name: Run unit tests
      run: |
        cd backend
        pytest tests/unit

    # Nothing under deprecated/ may be imported by live code. The rule is
    # enforced as a test as well; this keeps it visible in the CI log.
    - name: Check deprecated code is not imported
      run: |
        cd backend
        ! grep -rnE "^\s*(from|import)\s+deprecated\b" danswer heal
