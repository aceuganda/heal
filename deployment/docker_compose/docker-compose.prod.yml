# Heal production stack.
#
# Five services carry a health worker's question end to end:
#
#   nginx          TLS termination and routing
#   web_server     Next.js chat UI
#   api_server     FastAPI + MedicalGuidanceAgent
#   relational_db  PostgreSQL, the system of record
#   qdrant         the approved-source library answers are drawn from
#
# One optional profile, not on by default:
#
#   --profile letsencrypt   adds certbot for automatic certificate renewal.
#                           Omit it when TLS is terminated upstream; this
#                           replaces the old docker-compose.prod-no-letsencrypt.yml.
#
# Gone from the Danswer-era stack: `index` (Vespa 8.277.17), `background`
# (the supervisord fleet -- indexing loop, Celery, Beat, Dask, Slack listener)
# and `model_server`. The originals are frozen in deployment/deprecated/.
#
#   docker compose -f docker-compose.prod.yml -p heal-stack up -d
#   docker compose -f docker-compose.prod.yml --profile letsencrypt -p heal-stack up -d

services:
  api_server:
    image: khalifan1126/heal-backend:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    # `alembic upgrade head` is a no-op once production is stamped at
    # 0001_heal_baseline. NEVER let it run the rebaseline against production --
    # see docs/architecture-decisions.md, "Database migrations".
    command: >
      /bin/sh -c "alembic upgrade head &&
        echo 'Starting Heal API server' &&
        uvicorn heal_app.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      relational_db:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: always
    env_file:
      - .env
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-google_oauth}
      - POSTGRES_HOST=relational_db
      # Retrieval is the product; `false` still reproduces the pre-retrieval
      # behaviour exactly for a deployment that has to run without a store.
      - KNOWLEDGE_ENABLED=${KNOWLEDGE_ENABLED:-true}
      # Compose service name, resolved on the internal network.
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    # Python, not curl: curl does not survive the image's CVE cleanup.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    volumes:
      # Dynamic config store (see danswer/dynamic_configs). The connector temp
      # storage and the nltk/torch model caches went with the background fleet.
      - local_dynamic_storage:/home/storage
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  web_server:
    image: khalifan1126/heal-web:latest
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DISABLE_STREAMING=${NEXT_PUBLIC_DISABLE_STREAMING:-false}
    depends_on:
      - api_server
    restart: always
    env_file:
      - .env
    environment:
      - INTERNAL_URL=http://api_server:8080
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  relational_db:
    image: postgres:15.2-alpine
    restart: always
    # POSTGRES_USER and POSTGRES_PASSWORD are set in .env
    env_file:
      - .env
    # Not published to the host: the database is reachable only on the compose
    # network. Use `docker compose exec relational_db psql` for admin access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_volume:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  nginx:
    image: nginx:1.23.4-alpine
    restart: always
    # nginx exits immediately with `host not found in upstream` if the
    # api_server / web_server names do not resolve yet.
    depends_on:
      - api_server
      - web_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../data/nginx:/etc/nginx/conf.d
      - ../data/certbot/conf:/etc/letsencrypt
      - ../data/certbot/www:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    # NGINX_CONF_TEMPLATE selects the config: `app.conf.template` for the
    # certbot flow, `app.conf.template.no-letsencrypt` when TLS is terminated
    # upstream. One compose file, both deployment shapes.
    environment:
      - NGINX_CONF_TEMPLATE=${NGINX_CONF_TEMPLATE:-app.conf.template}
    # Order matters -- see the note in docker-compose.local.yml. Backgrounding
    # the whole chain starts nginx before envsubst has written app.conf, so it
    # reads whatever stale config is on the volume and crash-loops.
    #
    # The sleep gives web_server / api_server time to bind: nginx resolves
    # upstream names once, at startup, and exits if one does not resolve.
    command: >
      /bin/sh -c "sleep 10 &&
        envsubst '$$\{DOMAIN\}' < /etc/nginx/conf.d/$${NGINX_CONF_TEMPLATE} > /etc/nginx/conf.d/app.conf &&
        { while :; do sleep 6h & wait $${!}; nginx -s reload; done & } &&
        nginx -g \"daemon off;\""
    env_file:
      - .env.nginx

  # Only with --profile letsencrypt. Omit the profile when a load balancer or
  # an upstream proxy already terminates TLS.
  # Follows https://pentacent.medium.com/nginx-and-lets-encrypt-with-docker-in-less-than-5-minutes-b4b8a60d3a71
  certbot:
    image: certbot/certbot
    profiles:
      - "letsencrypt"
    restart: always
    volumes:
      - ../data/certbot/conf:/etc/letsencrypt
      - ../data/certbot/www:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # The vector store, part of the default stack.
  #
  # Qdrant's default setup has NO authentication, so QDRANT_API_KEY must be set
  # in .env; heal/config.py refuses a store reachable off the compose network
  # without one. No port is published to the host either -- the service is
  # reachable only from api_server on the compose network.
  # Named vectors are created on first ingest so dense + sparse hybrid search
  # is designed in rather than retrofitted (drug codes, dosages).
  qdrant:
    # v1.19.0 publishes linux/amd64 and linux/arm64.
    image: qdrant/qdrant:v1.19.0
    restart: always
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant_volume:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

volumes:
  local_dynamic_storage:
  db_volume:
  qdrant_volume:
