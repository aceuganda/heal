# The private image registry `make deploy` pushes to. Applied once by
# setup-server.sh.
#
# It listens on the node's loopback only, so nothing on the network can reach
# it: the node pulls from localhost, and the deploy reaches it with
# `kubectl port-forward`, which needs the deployer's token. Not part of
# kustomization.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: heal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Images share layers, so each deploy adds roughly its changed layers.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heal-registry
  namespace: heal
spec:
  replicas: 1
  # One pod holds the host port and the volume; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: heal-registry
  template:
    metadata:
      labels:
        app: heal-registry
    spec:
      # Host network so containerd on the node can pull from localhost; the
      # listen address keeps it off every other interface.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3.0.0
          env:
            # Must match CLUSTER_REGISTRY_PORT in the deploy CLI and the
            # mirror in /etc/rancher/k3s/registries.yaml.
            - name: REGISTRY_HTTP_ADDR
              value: "localhost:5050"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "none"
          ports:
            - containerPort: 5050
          readinessProbe:
            httpGet:
              host: localhost
              path: /v2/
              port: 5050
            periodSeconds: 10
          livenessProbe:
            httpGet:
              host: localhost
              path: /v2/
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
