apiVersion: v1
kind: ConfigMap
metadata:
  name: env-configmap
data:
  # Auth settings -- secrets live in secrets.yaml, not here
  AUTH_TYPE: "basic"  # Change this for production unless Heal is only reachable behind a VPN
  SESSION_EXPIRE_TIME_SECONDS: "86400"  # 1 day
  VALID_EMAIL_DOMAINS: ""  # Restrict sign-in to specific domains
  SMTP_SERVER: ""  # Defaults to smtp.gmail.com when unset
  SMTP_PORT: ""  # Defaults to 587 when unset
  SMTP_USER: ""
  SMTP_PASS: ""
  EMAIL_FROM: ""  # Used when SMTP_USER is missing

  # Chat model. Ids come from the catalogue in backend/heal/llm/registry.py.
  GEN_AI_MODEL_PROVIDER: "openai"
  GEN_AI_API_KEY: ""
  GEN_AI_API_ENDPOINT: ""
  GEN_AI_API_VERSION: ""
  HEAL_CHAT_MODEL: ""
  HEAL_CLASSIFIER_MODEL: ""
  HEAL_ENABLED_CHAT_MODELS: ""
  HEAL_LLM_TIMEOUT: ""

  # Translation (Design A). Required for Luganda chat; English is unaffected.
  # No default is baked into the image -- a missing URL fails with a config
  # error naming the variable rather than reaching someone else's server.
  TRANSLATION_PROVIDER: "heal_mt"
  TRANSLATION_EN_URL: ""
  TRANSLATION_LUG_URL: ""

  # Safety. Set the escalation number that is correct for this deployment's
  # country before the pilot.
  HEAL_EMERGENCY_CONTACT: "912"

  # Knowledge / retrieval. Phase 1 ships with this off; `false` reproduces
  # Phase 1 behaviour exactly, so Phase 2 can be cut without a rollback.
  # Qdrant runs unauthenticated by default, so the key is required when on.
  KNOWLEDGE_ENABLED: "false"
  QDRANT_URL: ""
  QDRANT_API_KEY: ""

  # Other services
  POSTGRES_HOST: "relational-db-service"
  INTERNAL_URL: "http://api-server-service:80"  # for web server
  WEB_DOMAIN: "https://heal.aceuganda.org"  # for web server and api server
  DOMAIN: "heal.aceuganda.org"  # for nginx

  # Logging
  DISABLE_TELEMETRY: "true"
  LOG_LEVEL: "info"
  LOG_ALL_MODEL_INTERACTIONS: ""  # Logs every prompt; never enable against real users
