apiVersion: v1
kind: Service
metadata:
  name: api-server-service
spec:
  selector:
    app: api-server
  ports:
    - name: api-server-port
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: api-server
        # Logical name. `make deploy` pins it to registry@digest through
        # kustomize, so a raw `kubectl apply -f` of this file fails to pull
        # rather than running an unscanned `latest`.
        image: heal-backend
        imagePullPolicy: IfNotPresent
        # `alembic upgrade head` is a no-op once production is stamped at
        # 0001_heal_baseline. NEVER let it run the rebaseline against
        # production -- see docs/architecture-decisions.md.
        command:
          - "/bin/sh"
          - "-c"
          - |
            alembic upgrade head &&
            echo "Starting Heal API server" &&
            uvicorn heal_app.main:app --host 0.0.0.0 --port 8080
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
        # There are some extra values since this is shared between services
        # There are no conflicts though, extra env variables are simply ignored
        envFrom:
        - configMapRef:
            name: env-configmap
        # Credentials come from heal-secrets, not the ConfigMap; `env` wins
        # over `envFrom`, so a key left in the ConfigMap is ignored.
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: heal-secrets
              key: postgres_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: heal-secrets
              key: postgres_password
        - name: GEN_AI_API_KEY
          valueFrom:
            secretKeyRef:
              name: heal-secrets
              key: gen_ai_api_key
              optional: true
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: heal-secrets
              key: qdrant_api_key
              optional: true
        volumeMounts:
        # The file-connector volume went with the connectors. Its PVC is left
        # declared in persistent-volumes.yaml rather than deleted, because
        # removing a PVC destroys data -- see the deprecation policy (D5).
        - name: dynamic-storage
          mountPath: /home/storage
      volumes:
      - name: dynamic-storage
        persistentVolumeClaim:
          claimName: dynamic-pvc
