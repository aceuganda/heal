apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What `make deploy` applies. env-configmap.yaml and secrets.yaml are left out
# on purpose: the cluster's copies hold the real settings and keys, and
# re-applying the repo templates would blank them. Apply those by hand.
resources:
  - persistent-volumes.yaml
  - postgres-service-deployment.yaml
  - api_server-service-deployment.yaml
  - web_server-service-deployment.yaml
  - nginx-configmap.yaml
  - nginx-service-deployment.yaml
