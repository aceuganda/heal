# The values in this file should be changed
apiVersion: v1
kind: Secret
metadata:
  name: heal-secrets
type: Opaque
data:
  postgres_user: cG9zdGdyZXM= # "postgres" base64 encoded
  postgres_password: cGFzc3dvcmQ= # "password" base64 encoded
  gen_ai_api_key: # optional; the LLM provider key, base64 encoded
  qdrant_api_key: # required by Qdrant; openssl rand -hex 32 | tr -d '\n' | base64
  user_auth_secret: # required; signs reset/verify tokens. openssl rand -hex 32 | tr -d '\n' | base64
  translation_api_key: # optional; bearer token for the MT services
  self_hosted_api_key: # optional; the vLLM endpoint's key
  smtp_pass: # optional
  bootstrap_admin_email: # optional; seeds the first admin into an EMPTY user table
  bootstrap_admin_password: # optional; with bootstrap_admin_email
  google_oauth_client_id: # You will need to provide this, use echo -n "your-client-id" | base64
  google_oauth_client_secret: # You will need to provide this, use echo -n "your-client-id" | base64
